<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図書館蔵書検索</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>図書館蔵書検索</h1>
  </header>

  <main>
    <!-- タブ -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="search">蔵書検索</button>
      <button class="tab-btn" data-tab="occupation">職業別おすすめ</button>
    </div>

    <!-- 蔵書検索タブ -->
    <div id="tab-search" class="tab-panel">
      <section class="search-box">
        <div class="search-row">
          <input type="text" id="query" placeholder="タイトル・著者名・ISBNで検索..." autocomplete="off">
          <button id="search-btn">検索</button>
        </div>
        <div class="filter-row">
          <label>
            ジャンル:
            <select id="genre">
              <option value="">すべて</option>
              {% for g in genres %}
              <option value="{{ g }}">{{ g }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="available-only">
            貸出可能のみ表示
          </label>
        </div>
      </section>

      <section id="results-section">
        <div id="result-count"></div>
        <div id="results"></div>
      </section>
    </div>

    <!-- 職業別おすすめタブ -->
    <div id="tab-occupation" class="tab-panel hidden">
      <section class="search-box">
        <div class="occ-filter-row">
          <label class="checkbox-label">
            <input type="checkbox" id="occ-available-only">
            貸出可能のみ表示
          </label>
        </div>
      </section>

      <!-- 職業一覧 -->
      <div id="occ-list-view">
        <p class="section-lead">職業を選ぶと、関連するおすすめ図書を表示します。</p>
        <div id="occ-cards"></div>
      </div>

      <!-- 職業別書籍一覧 -->
      <div id="occ-book-view" class="hidden">
        <button id="occ-back-btn" class="back-btn">&larr; 職業一覧に戻る</button>
        <div id="occ-book-header"></div>
        <div id="occ-book-count"></div>
        <div id="occ-books"></div>
      </div>
    </div>
  </main>

  <!-- Detail modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    /* ---- Utilities ---- */
    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ---- Tab switching ---- */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    /* ==============================
       蔵書検索タブ
    ============================== */
    const queryInput   = document.getElementById('query');
    const genreSelect  = document.getElementById('genre');
    const availableOnly = document.getElementById('available-only');
    const resultsEl    = document.getElementById('results');
    const resultCount  = document.getElementById('result-count');
    const overlay      = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');

    let debounceTimer;

    function search() {
      const params = new URLSearchParams();
      const q = queryInput.value.trim();
      if (q) params.set('q', q);
      const g = genreSelect.value;
      if (g) params.set('genre', g);
      if (availableOnly.checked) params.set('available_only', '1');

      fetch('/api/search?' + params.toString())
        .then(r => r.json())
        .then(books => renderBooks(books, resultsEl, resultCount));
    }

    function renderBooks(books, container, countEl) {
      if (countEl) countEl.textContent = `${books.length} 件見つかりました`;
      if (books.length === 0) {
        container.innerHTML = '<p class="no-result">該当する書籍はありませんでした。</p>';
        return;
      }
      container.innerHTML = books.map(b => `
        <div class="book-card ${b.available ? 'available' : 'unavailable'}" data-id="${b.id}">
          <div class="book-status">${b.available ? '貸出可' : '貸出中'}</div>
          <div class="book-title">${escHtml(b.title)}</div>
          <div class="book-author">${escHtml(b.author)}</div>
          <div class="book-meta">${escHtml(b.genre)} &middot; ${b.year ?? ''}年</div>
          ${b.note ? `<div class="book-note">${escHtml(b.note)}</div>` : ''}
        </div>
      `).join('');

      container.querySelectorAll('.book-card').forEach(card => {
        card.addEventListener('click', () => showDetail(card.dataset.id));
      });
    }

    function showDetail(id) {
      fetch('/api/book/' + id)
        .then(r => r.json())
        .then(b => {
          modalContent.innerHTML = `
            <h2>${escHtml(b.title)}</h2>
            <table class="detail-table">
              <tr><th>著者</th><td>${escHtml(b.author)}</td></tr>
              <tr><th>ジャンル</th><td>${escHtml(b.genre)}</td></tr>
              <tr><th>出版年</th><td>${b.year ?? '不明'}年</td></tr>
              <tr><th>ISBN</th><td>${escHtml(b.isbn)}</td></tr>
              <tr><th>貸出状況</th><td class="${b.available ? 'status-ok' : 'status-ng'}">${b.available ? '貸出可能' : '貸出中'}</td></tr>
            </table>
          `;
          overlay.classList.remove('hidden');
        });
    }

    document.getElementById('search-btn').addEventListener('click', search);
    queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    queryInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 300);
    });
    genreSelect.addEventListener('change', search);
    availableOnly.addEventListener('change', search);

    document.getElementById('modal-close').addEventListener('click', () => overlay.classList.add('hidden'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });

    search(); // 初期表示

    /* ==============================
       職業別おすすめタブ
    ============================== */
    const occCards     = document.getElementById('occ-cards');
    const occListView  = document.getElementById('occ-list-view');
    const occBookView  = document.getElementById('occ-book-view');
    const occBookHeader = document.getElementById('occ-book-header');
    const occBookCount = document.getElementById('occ-book-count');
    const occBooks     = document.getElementById('occ-books');
    const occAvailOnly = document.getElementById('occ-available-only');
    let currentOccId   = null;

    function loadOccupations() {
      fetch('/api/occupations')
        .then(r => r.json())
        .then(list => {
          occCards.innerHTML = list.map(o => `
            <div class="occ-card" data-id="${o.id}">
              <div class="occ-icon">${escHtml(o.icon)}</div>
              <div class="occ-name">${escHtml(o.name)}</div>
              <div class="occ-desc">${escHtml(o.description)}</div>
              <div class="occ-count">${o.book_count} 冊</div>
            </div>
          `).join('');

          occCards.querySelectorAll('.occ-card').forEach(card => {
            card.addEventListener('click', () => showOccupationBooks(Number(card.dataset.id)));
          });
        });
    }

    function showOccupationBooks(occId) {
      currentOccId = occId;
      const params = new URLSearchParams();
      if (occAvailOnly.checked) params.set('available_only', '1');

      fetch(`/api/occupations/${occId}/books?` + params.toString())
        .then(r => r.json())
        .then(data => {
          const { occupation: occ, books } = data;
          occBookHeader.innerHTML = `
            <div class="occ-book-title">
              <span class="occ-icon-lg">${escHtml(occ.icon)}</span>
              <div>
                <h2>${escHtml(occ.name)}</h2>
                <p>${escHtml(occ.description)}</p>
              </div>
            </div>
          `;
          occListView.classList.add('hidden');
          occBookView.classList.remove('hidden');
          renderBooks(books, occBooks, occBookCount);
        });
    }

    document.getElementById('occ-back-btn').addEventListener('click', () => {
      occBookView.classList.add('hidden');
      occListView.classList.remove('hidden');
      currentOccId = null;
    });

    occAvailOnly.addEventListener('change', () => {
      if (currentOccId !== null) showOccupationBooks(currentOccId);
    });

    loadOccupations();
  </script>
</body>
</html>
